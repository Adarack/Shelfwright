<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shelfwright</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a66;--line:#e2e0da;--acc:#2f6f5e;--warn:#a05a00;--bad:#b3261e;--ok:#2e7d32;--chip:#eeece6}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#20201e;--ink:#ecebe7;--mute:#9b9a95;--line:#34332f;--acc:#6fc2a8;--warn:#e0a24a;--bad:#ef7b72;--ok:#7ccf83;--chip:#2b2a27}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:2;flex-wrap:wrap}
h1{font-size:17px;margin:0 8px 0 0}.mute{color:var(--mute)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}button:hover{filter:brightness(.96)}button:disabled{opacity:.5;cursor:default}
main{display:grid;grid-template-columns:260px 1fr;gap:16px;padding:16px;max-width:1400px;margin:auto}
@media (max-width:800px){main{grid-template-columns:1fr}}
nav a{display:flex;justify-content:space-between;padding:6px 10px;border-radius:6px;color:inherit;text-decoration:none;cursor:pointer}
nav a.on{background:var(--chip);font-weight:600}nav h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:14px 10px 4px}
.n{background:var(--chip);border-radius:10px;padding:0 7px;font-size:12px}.n.z{opacity:.4}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.f{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.f .t{font-weight:600;word-break:break-word}.f .s{color:var(--mute)}.f .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.st{font-size:11px;border-radius:4px;padding:1px 6px;margin-left:6px;background:var(--chip)}
.st.failed{color:var(--bad)}.st.applied{color:var(--ok)}.st.queued,.st.running{color:var(--warn)}
details{margin-top:6px}summary{cursor:pointer;color:var(--mute);font-size:12px}
pre,table{font-size:12px}pre{white-space:pre-wrap;word-break:break-all;background:var(--chip);padding:8px;border-radius:6px;max-height:360px;overflow:auto;margin:6px 0 0}
table{border-collapse:collapse;width:100%;margin-top:6px}td,th{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top;word-break:break-word}
.safe{font-size:11px;color:var(--acc);margin-left:6px}
.jobs .j{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.jobs .j span:first-child{flex:1;word-break:break-word}
</style></head><body>
<header><h1>Shelfwright</h1><span id="last" class="mute"></span><span style="flex:1"></span>
<button id="scan" class="p">Scan now</button></header>
<main><nav id="nav"></nav><section><div class="bar" id="bar"></div><div id="list"></div></section></main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
let S={check:null,status:"open",sum:null};
const api=(p,b)=>fetch(p,b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:{}).then(r=>r.json());
const ago=t=>{if(!t)return"never";const m=Math.round((Date.now()/1e3-t)/60);return m<60?m+" min ago":m<2880?Math.round(m/60)+" h ago":Math.round(m/1440)+" days ago"};
const GROUPS=[["Audiobookshelf",["drama","title","author_variant","author_initials","series_variant","duplicate","abs_missing","abs_double"]],
 ["Files",["tag_sync","naming","collision","convert","backup","empty_dirs"]],["Chaptarr",["ch_stale","ch_unlinked","ch_author_path","ch_wrong_author"]]];
async function load(){
  const s=S.sum=await api("/api/summary");
  $("#last").textContent="Last scan "+ago(s.last_scan)+(s.auto_apply_safe?" · safe fixes apply automatically":" · safe fixes wait for approval");
  let h=`<a data-c="" class="${S.check?"":"on"}">All open<span class="n">${Object.values(s.counts).reduce((a,c)=>a+(c.open||0)+(c.failed||0),0)}</span></a>`;
  for(const [g,cs] of GROUPS){h+=`<h3>${g}</h3>`;for(const c of cs){const n=(s.counts[c]?.open||0)+(s.counts[c]?.failed||0);
    h+=`<a data-c="${c}" class="${S.check===c?"on":""}" title="${esc(s.checks[c]?.[1])}">${esc(s.checks[c]?.[0]||c)}<span class="n ${n?"":"z"}">${n}</span></a>`}}
  h+=`<h3>Jobs</h3><div class="jobs">`+s.jobs.map(j=>`<div class="j" data-j="${j.id}"><span>${esc(j.title)}</span><span class="st ${j.status=="done"?"applied":j.status}">${j.status}</span></div>`).join("")+"</div>";
  $("#nav").innerHTML=h;
  $("#nav").querySelectorAll("a").forEach(a=>a.onclick=()=>{S.check=a.dataset.c||null;load()});
  $("#nav").querySelectorAll(".j").forEach(a=>a.onclick=()=>showJob(a.dataset.j));
  await list();
}
function detail(d){
  if(!d||!Object.keys(d).length)return"";
  let h="";
  if(d.moves)h+=`<table><tr><th>From</th><th>To</th></tr>${d.moves.map(m=>`<tr><td>${esc(m.from)}</td><td>${esc(m.to)}</td></tr>`).join("")}</table>`+(d.count>d.moves.length?`<div class="mute">…and ${d.count-d.moves.length} more</div>`:"");
  else if(d.copies)h+=`<table><tr><th>Copy</th><th>Hours</th><th>Files</th><th>Listened</th></tr>${d.copies.map(c=>`<tr><td>${esc(c.path)}</td><td>${c.duration_h}</td><td>${c.files}</td><td>${c.progress?"yes":""}</td></tr>`).join("")}</table>`;
  else if(d.changes)h+=`<table><tr><th>Field</th><th>Now</th><th>Becomes</th></tr>${Object.entries(d.changes).map(([k,[a,b]])=>`<tr><td>${k}</td><td>${esc(Array.isArray(a)?a.join("; "):a)}</td><td>${esc(Array.isArray(b)?b.join("; "):b)}</td></tr>`).join("")}</table>`+(d.path?`<div class="mute">${esc(d.path)}</div>`:"");
  else h+=`<pre>${esc(JSON.stringify(d,null,2))}</pre>`;
  return `<details><summary>Details</summary>${h}</details>`;
}
function card(f){
  const a=f.action, can=["open","failed"].includes(f.status);
  let acts="";
  if(can&&a){
    if(a.type==="choose")acts=a.options.map((o,i)=>`<button class="${a.options.length==1?"p":""}" data-ap="${f.id}" data-o="${i}">${esc(o.label)}</button>`).join("");
    else acts=`<button class="p" data-ap="${f.id}">Apply fix</button>`;
  }
  if(can)acts+=`<button data-rj="${f.id}">${a?"Ignore":"Dismiss"}</button>`;
  const name=S.sum.checks[f.check]?.[0]||f.check;
  return `<div class="f"><div class="t">${esc(f.title)}<span class="st ${f.status}">${f.status}</span>${f.safe?'<span class="safe">safe</span>':""}</div>
  <div class="s">${S.check?"":esc(name)+" · "}${esc(f.summary)}</div>${f.status=="failed"&&f.result?`<div style="color:var(--bad)">${esc(f.result)}</div>`:""}
  ${detail(f.detail)}${acts?`<div class="acts">${acts}</div>`:""}</div>`;
}
async function list(){
  const st=S.status==="open"?"":S.status;
  let fs=await api(`/api/findings?status=${st}&check=${S.check||""}`);
  if(S.status==="open")fs=fs.filter(f=>f.status==="open"||f.status==="failed");
  const bulk=S.status==="open"&&S.check&&fs.some(f=>f.action);
  $("#bar").innerHTML=["open","queued","running","applied","rejected","resolved"].map(x=>`<button data-s="${x}" class="${S.status==x?"p":""}">${x}</button>`).join("")
    +(bulk?`<span style="flex:1"></span><button id="all" class="p">Approve all ${fs.length}</button>`:"");
  $("#bar").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.status=b.dataset.s;list()});
  if(bulk)$("#all").onclick=async()=>{
    const multi=fs.some(f=>f.action?.type==="choose"&&f.action.options.length>1);
    if(multi&&!confirm("Some of these have several options. Approve all with the first option?"))return;
    if(!confirm(`Queue ${fs.length} fixes?`))return;
    await api("/api/findings/approve-all",{check:S.check,first_option:multi});load()};
  $("#list").innerHTML=fs.length?fs.slice(0,500).map(card).join("")+(fs.length>500?`<div class="mute">Showing 500 of ${fs.length}</div>`:""):`<div class="mute" style="padding:20px">Nothing here.</div>`;
  $("#list").querySelectorAll("[data-ap]").forEach(b=>b.onclick=async()=>{b.disabled=true;
    await api(`/api/findings/${b.dataset.ap}/approve`,b.dataset.o!==undefined?{option:+b.dataset.o}:{});load()});
  $("#list").querySelectorAll("[data-rj]").forEach(b=>b.onclick=async()=>{await api(`/api/findings/${b.dataset.rj}/reject`,{});load()});
}
async function showJob(id){
  const j=await api("/api/jobs/"+id);
  $("#bar").innerHTML=`<button id="back">← Back</button><b>${esc(j.title)}</b><span class="st">${j.status}</span>`;
  $("#back").onclick=list;
  $("#list").innerHTML=`<pre style="max-height:none">${esc(j.log||"(no output yet)")}</pre>`;
}
$("#scan").onclick=async()=>{$("#scan").disabled=true;await api("/api/scan",{});setTimeout(()=>{$("#scan").disabled=false;load()},1500)};
load();setInterval(()=>{if(!document.querySelector("details[open]")&&!$("#back"))load()},15000);
</script></body></html>
